<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Изучаем таблицу весело!</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f0f0f0;
            font-family: Inter, sans-serif;
        }
        .Box {
            position: relative;
            background-color: white;
        }
        [class^="Answer"], [class^="Example"] {
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-origin: center;
            user-select: none;
            box-sizing: border-box;
            transition: opacity 0.5s ease, background-color 0.3s ease, border 0.3s ease;
            cursor: pointer;
        }
        .selected {
            filter: brightness(1.2);
            border: 4px solid #3316F2;
        }
        .fading {
            opacity: 0;
        }
        #gameOver, #gameWon {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            background: rgba(19, 142, 224, 0.8);
            color: white;
            padding: 20px;
            font-size: 24px;
            border-radius: 10px;
            display: none;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        #gameOver.show, #gameWon.show {
            display: block;
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        .modal-buttons {
            margin-top: 12px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .modal-button {
            padding: 10px 20px;
            font-size: 18px;
            background: #0ace38;
            color: rgb(2, 65, 26);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .modal-button:hover {
            background: #20c679;
        }
        .modal-button.secondary {
            background: rgba(255, 255, 255, 0.9);
            color: #138ee0;
        }
        .modal-button.secondary:hover {
            background: #ffffff;
        }
        #counter {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 18px;
            color: #2DA5D0;
            background: rgba(255, 255, 255, 0.8);
            padding: 5px 10px;
            border-radius: 5px;
            z-index: 5;
        }
        #modeLabel {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 14px;
            font-weight: 600;
            color: #D02DC6;
            background: rgba(255, 255, 255, 0.8);
            padding: 5px 10px;
            border-radius: 5px;
            z-index: 5;
        }
        #menuButton {
            position: absolute;
            bottom: 10px;
            right: 10px;
            padding: 5px 12px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.8);
            color: #2DA5D0;
            border: 2px solid #2DA5D0;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s ease;
            z-index: 5;
        }
        #menuButton:hover {
            background: #e8f4fa;
        }
        #menu {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(240, 240, 240, 0.96);
            z-index: 10;
        }
        #menu.open {
            display: flex;
        }
        .menu-card {
            width: 520px;
            max-width: 92vw;
            max-height: 92vh;
            overflow: auto;
            box-sizing: border-box;
            background: white;
            border-radius: 20px;
            outline: 9px solid #2DA5D0;
            padding: 24px;
            text-align: center;
        }
        .menu-title {
            font-size: 28px;
            font-weight: 700;
            color: #2DA5D0;
            margin: 4px 0 12px;
        }
        .menu-section-title {
            font-size: 15px;
            font-weight: 600;
            color: #666;
            margin: 16px 0 8px;
        }
        .option-row {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .option {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 12px 8px;
            background: #F1F6FA;
            border: 3px solid #E1E8EE;
            border-radius: 14px;
            cursor: pointer;
            font-family: inherit;
            transition: border-color 0.2s ease, background 0.2s ease;
        }
        .option:hover {
            border-color: #9cc4dd;
        }
        .option.selected {
            border-color: #3316F2;
            background: #E8F1F8;
        }
        .option-sign {
            font-size: 30px;
            font-weight: 600;
            font-family: Roboto, sans-serif;
            color: #2DA5D0;
            line-height: 1.1;
        }
        .option-name {
            font-size: 15px;
            font-weight: 600;
            color: #333;
        }
        .difficulty-hint {
            margin-top: 10px;
            min-height: 18px;
            font-size: 13px;
            color: #888;
        }
        #playButton {
            margin-top: 18px;
            padding: 14px 48px;
            font-size: 22px;
            font-weight: 600;
            background: #0ace38;
            color: rgb(2, 65, 26);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        #playButton:hover {
            background: #20c679;
        }
    </style>
</head>
<body>
    <div data-layer="Box" class="Box" style="width: 600px; height: 600px; overflow: hidden; outline: 9px #2DA5D0 solid; outline-offset: 0px">
        <div id="counter">Элементы: 0/20</div>
        <div id="modeLabel"></div>
        <button id="menuButton" type="button">Меню</button>
    </div>
    <div id="gameOver">
        Старайся, у тебя получится!
        <div class="modal-buttons">
            <button class="modal-button restart" type="button">Ещё раз</button>
            <button class="modal-button secondary tomenu" type="button">В меню</button>
        </div>
    </div>
    <div id="gameWon">
        Правильно, молодец!
        <div class="modal-buttons">
            <button class="modal-button restart" type="button">Ещё раз</button>
            <button class="modal-button secondary tomenu" type="button">В меню</button>
        </div>
    </div>
    <div id="menu" class="open">
        <div class="menu-card">
            <div class="menu-title">Изучаем таблицу весело!</div>
            <div class="menu-section-title">Тип заданий</div>
            <div class="option-row" id="typeRow">
                <button class="option selected" type="button" data-type="multiply">
                    <span class="option-sign">×</span>
                    <span class="option-name">Умножение</span>
                </button>
                <button class="option" type="button" data-type="divide">
                    <span class="option-sign">:</span>
                    <span class="option-name">Деление</span>
                </button>
                <button class="option" type="button" data-type="mixed">
                    <span class="option-sign">× :</span>
                    <span class="option-name">Смешанный</span>
                </button>
            </div>
            <div class="menu-section-title">Сложность</div>
            <div class="option-row" id="difficultyRow">
                <button class="option" type="button" data-difficulty="easy">
                    <span class="option-name">Легкий</span>
                </button>
                <button class="option selected" type="button" data-difficulty="medium">
                    <span class="option-name">Средний</span>
                </button>
                <button class="option" type="button" data-difficulty="hard">
                    <span class="option-name">Сложный</span>
                </button>
            </div>
            <div class="difficulty-hint" id="difficultyHint"></div>
            <button id="playButton" type="button">Играть!</button>
        </div>
    </div>
    <audio id="correctSound" preload="auto" src="sounds/correct.mp3"></audio>
    <audio id="wrongSound" preload="auto" src="sounds/wrong.mp3"></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.18.0/matter.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const engine = Matter.Engine.create({
                enableSleeping: true
            });
            const world = engine.world;

            engine.world.gravity.y = 1.2;

            const boxContainer = document.querySelector('.Box');
            const boxWidth = parseInt(boxContainer.style.width);
            const boxHeight = parseInt(boxContainer.style.height);
            const gameOverDiv = document.querySelector('#gameOver');
            const gameWonDiv = document.querySelector('#gameWon');
            const counterDiv = document.querySelector('#counter');
            const modeLabel = document.querySelector('#modeLabel');
            const menuDiv = document.querySelector('#menu');
            const difficultyHint = document.querySelector('#difficultyHint');
            const correctSound = document.querySelector('#correctSound');
            const wrongSound = document.querySelector('#wrongSound');
            const maxElements = 20;

            // ---------- Настройки, выбранные в меню ----------
            const settings = { type: 'multiply', difficulty: 'medium' };

            const TYPE_LABELS = { multiply: 'Умножение', divide: 'Деление', mixed: 'Смешанный' };
            const DIFFICULTY_LABELS = { easy: 'Легкий', medium: 'Средний', hard: 'Сложный' };
            const DIFFICULTY_HINTS = {
                easy: 'Почти все примеры простые, лишь пара посложнее',
                medium: 'Простые и трудные примеры вперемешку',
                hard: 'В основном трудные примеры: 6×8, 7×8, 9×6…'
            };

            // Состав стартовых 10 пар: сколько примеров каждого уровня сложности
            const INITIAL_COUNTS = {
                easy: { easy: 6, medium: 2, hard: 2 },
                medium: { easy: 3, medium: 3, hard: 4 },
                hard: { easy: 1, medium: 2, hard: 7 }
            };

            // Вероятности уровней для пар, добавляемых за неправильный ответ
            const DIFFICULTY_MIX = {
                easy: { easy: 0.6, medium: 0.2, hard: 0.2 },
                medium: { easy: 0.3, medium: 0.3, hard: 0.4 },
                hard: { easy: 0.1, medium: 0.2, hard: 0.7 }
            };

            // ---------- Примеры таблицы умножения ----------
            // Сочетания, которые запоминаются труднее всего
            const HARD_FACTS = new Set(['3×7', '3×8', '4×9', '6×6', '6×7', '6×8', '6×9', '7×7', '7×8', '7×9', '8×8', '8×9', '9×9']);

            function factKey(a, b) {
                return a <= b ? a + '×' + b : b + '×' + a;
            }

            function factLevel(a, b) {
                const key = factKey(a, b);
                if (HARD_FACTS.has(key)) return 'hard';
                if (a === 2 || b === 2 || a === 5 || b === 5 || key === '3×3' || key === '3×4') return 'easy';
                return 'medium';
            }

            const FACT_POOLS = { easy: [], medium: [], hard: [] };
            for (let a = 2; a <= 9; a++) {
                for (let b = a; b <= 9; b++) {
                    FACT_POOLS[factLevel(a, b)].push({ a: a, b: b });
                }
            }

            function shuffle(arr) {
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }

            function getAllElements() {
                return [...document.querySelectorAll('[class^="Answer"], [class^="Example"]')];
            }

            // Сочетания и ответы, уже лежащие на поле, — чтобы не дублировать шарики
            function usedFactKeys() {
                return new Set(getAllElements().map(el => el.dataset.fact));
            }

            function usedAnswerValues() {
                return new Set(getAllElements().filter(el => el.dataset.kind === 'answer').map(el => el.dataset.value));
            }

            function makePair(fact) {
                const op = settings.type === 'mixed'
                    ? (Math.random() < 0.5 ? '×' : ':')
                    : (settings.type === 'multiply' ? '×' : ':');
                if (op === '×') {
                    const first = Math.random() < 0.5 ? fact.a : fact.b;
                    const second = first === fact.a ? fact.b : fact.a;
                    return { expression: first + '×' + second, answer: String(first * second), value: first * second };
                }
                const product = fact.a * fact.b;
                const divisor = Math.random() < 0.5 ? fact.a : fact.b;
                return { expression: product + ':' + divisor, answer: String(product / divisor), value: product / divisor };
            }

            // Ищем пару заданного уровня: без повтора сочетания, а по возможности и без повтора ответа
            function tryMakePair(level, used, answers, strict) {
                for (const fact of shuffle(FACT_POOLS[level].slice())) {
                    const key = factKey(fact.a, fact.b);
                    if (used.has(key)) continue;
                    const pair = makePair(fact);
                    if (strict && answers.has(pair.answer)) continue;
                    used.add(key);
                    answers.add(pair.answer);
                    pair.fact = key;
                    return pair;
                }
                return null;
            }

            function drawPairs(levelCounts) {
                const used = usedFactKeys();
                const answers = usedAnswerValues();
                const pairs = [];
                Object.keys(levelCounts).forEach(level => {
                    for (let i = 0; i < levelCounts[level]; i++) {
                        let pair = tryMakePair(level, used, answers, true);
                        if (!pair) pair = tryMakePair(level, used, answers, false);
                        if (pair) pairs.push(pair);
                    }
                });
                return pairs;
            }

            function pickWeightedLevel() {
                const mix = DIFFICULTY_MIX[settings.difficulty];
                const roll = Math.random();
                let acc = 0;
                for (const name of ['easy', 'medium', 'hard']) {
                    acc += mix[name];
                    if (roll < acc) return name;
                }
                return 'hard';
            }

            function drawAddedPairs(count) {
                const counts = {};
                for (let i = 0; i < count; i++) {
                    const level = pickWeightedLevel();
                    counts[level] = (counts[level] || 0) + 1;
                }
                return drawPairs(counts);
            }

            // ---------- Физика ----------
            const wallOptions = {
                isStatic: true,
                render: { visible: false },
                collisionFilter: { group: -1 }
            };

            const walls = [
                Matter.Bodies.rectangle(boxWidth / 2, 0, boxWidth, 1, wallOptions),
                Matter.Bodies.rectangle(boxWidth / 2, boxHeight, boxWidth, 1, wallOptions),
                Matter.Bodies.rectangle(0, boxHeight / 2, 1, boxHeight, wallOptions),
                Matter.Bodies.rectangle(boxWidth, boxHeight / 2, 1, boxHeight, wallOptions)
            ];

            Matter.Composite.add(world, walls);

            const bodies = [];
            let elementCounter = 0;
            let selectedElement = null;
            let runner = null;

            const initialPositions = [
                { left: 408, top: 330 },
                { left: 274, top: 272 },
                { left: 46, top: 465 },
                { left: 16, top: 335 },
                { left: 190, top: 198 },
                { left: 356, top: 195 },
                { left: 456, top: 126 },
                { left: 26, top: 26 },
                { left: 296, top: 385 },
                { left: 198, top: 451 },
                { left: 372, top: 465 },
                { left: 156, top: 344 },
                { left: 96, top: 255 },
                { left: 24, top: 161 },
                { left: 126, top: 86 },
                { left: 246, top: 106 },
                { left: 344, top: 49 },
                { left: 472, top: 17 },
                { left: 481, top: 424 },
                { left: 483, top: 235 }
            ];

            function updateCounter() {
                const count = getAllElements().length;
                counterDiv.textContent = `Элементы: ${count}/${maxElements}`;
            }

            function createBall(kind, pair, left, top) {
                const isAnswer = kind === 'Answer';
                const text = isAnswer ? pair.answer : pair.expression;
                const long = text.length > 3;
                const fontSize = isAnswer ? '64px' : (long ? '32px' : '40px');
                const lineHeight = isAnswer ? '96px' : (long ? '44px' : '60px');
                const background = isAnswer ? '#2DA5D0' : '#D02DC6';

                const element = document.createElement('div');
                element.setAttribute('data-layer', `${kind.toLowerCase()}${elementCounter}`);
                element.className = `${kind}${elementCounter}`;
                element.dataset.kind = isAnswer ? 'answer' : 'example';
                element.dataset.value = String(pair.value);
                element.dataset.fact = pair.fact;
                element.style.cssText = `
                    width: 100px; height: 100px; padding: 10px; left: ${left}px; top: ${top}px;
                    position: absolute; background: ${background}; border-radius: 50px;
                    flex-direction: column; justify-content: center; align-items: center;
                    gap: 10px; display: inline-flex;
                `;
                element.innerHTML = `
                    <div style="width: 96px; text-align: center; color: #FAFAFA;
                    font-size: ${fontSize}; font-family: Roboto; font-weight: 500;
                    line-height: ${lineHeight}; word-wrap: break-word">${text}</div>
                `;
                element.addEventListener('click', handleClick);

                boxContainer.appendChild(element);

                const radius = 50;
                const body = Matter.Bodies.circle(left + radius, top + radius, radius, {
                    restitution: 0.1,
                    friction: 0.6,
                    frictionAir: 0.02,
                    density: 0.02,
                    inertia: Infinity, // шарики не вращаются — текст всегда читается
                    render: { visible: false }
                });

                bodies.push(body);
                element.body = body;
                body.element = element;

                Matter.World.add(world, body);

                element.style.left = '0';
                element.style.top = '0';
                element.style.transform = `translate(${left}px, ${top}px)`;

                return element;
            }

            function spawnPair(pair, posAnswer, posExample) {
                elementCounter++;
                createBall('Answer', pair, posAnswer.left, posAnswer.top);
                elementCounter++;
                createBall('Example', pair, posExample.left, posExample.top);
            }

            function jiggle() {
                world.bodies.forEach(body => {
                    // будим уснувшие тела, иначе куча не осыплется после удаления пары
                    Matter.Sleeping.set(body, false);
                    const angle = Math.random() * 2 * Math.PI;
                    Matter.Body.applyForce(body, body.position, {
                        x: 0.0005 * Math.cos(angle),
                        y: 0.0005 * Math.sin(angle)
                    });
                });
            }

            function startRunner() {
                if (!runner) {
                    runner = Matter.Runner.create();
                    Matter.Runner.run(runner, engine);
                }
            }

            function stopRunner() {
                if (runner) {
                    Matter.Runner.stop(runner);
                    runner = null;
                }
            }

            function resetGame() {
                stopRunner();
                getAllElements().forEach(el => el.remove());
                bodies.slice().forEach(body => Matter.World.remove(world, body));
                bodies.length = 0;
                elementCounter = 0;
                selectedElement = null;
                gameOverDiv.classList.remove('show');
                gameWonDiv.classList.remove('show');
            }

            function startGame() {
                resetGame();
                modeLabel.textContent = `${TYPE_LABELS[settings.type]} · ${DIFFICULTY_LABELS[settings.difficulty]}`;
                const positions = shuffle(initialPositions.slice());
                drawPairs(INITIAL_COUNTS[settings.difficulty]).forEach(pair => {
                    spawnPair(pair, positions.pop(), positions.pop());
                });
                jiggle();
                startRunner();
                updateCounter();
            }

            function addNewPairs() {
                const currentElements = getAllElements();
                if (currentElements.length + 4 > maxElements) {
                    gameOver();
                    return;
                }

                drawAddedPairs(2).forEach(pair => {
                    const pos1 = initialPositions[Math.floor(Math.random() * initialPositions.length)];
                    const pos2 = initialPositions[Math.floor(Math.random() * initialPositions.length)];
                    spawnPair(pair, pos1, pos2);
                });

                jiggle();
                updateCounter();
            }

            function gameOver() {
                gameOverDiv.classList.add('show');
                stopRunner();
                getAllElements().forEach(el => el.removeEventListener('click', handleClick));
            }

            function gameWon() {
                gameWonDiv.classList.add('show');
                stopRunner();
                getAllElements().forEach(el => el.removeEventListener('click', handleClick));
            }

            function handleClick() {
                if (this.classList.contains('fading')) return;

                const isAnswer = this.dataset.kind === 'answer';
                const value = this.dataset.value;

                if (selectedElement === this) {
                    this.classList.remove('selected');
                    selectedElement = null;
                    return;
                }

                if (selectedElement) {
                    const prevIsAnswer = selectedElement.dataset.kind === 'answer';
                    const prevValue = selectedElement.dataset.value;

                    if (isAnswer !== prevIsAnswer && value === prevValue) {
                        // Найдена пара
                        correctSound.play().catch(() => {});
                        this.classList.add('fading');
                        selectedElement.classList.add('fading');

                        const removedBodies = [this.body, selectedElement.body].filter(body => body && world.bodies.includes(body));
                        const elementToRemove = this;
                        const selectedElementToRemove = selectedElement;
                        selectedElement = null;

                        setTimeout(() => {
                            if (removedBodies.length > 0) {
                                Matter.World.remove(world, removedBodies);
                            }
                            if (elementToRemove && elementToRemove.parentNode) elementToRemove.remove();
                            if (selectedElementToRemove && selectedElementToRemove.parentNode) selectedElementToRemove.remove();
                            removedBodies.forEach(body => {
                                const index = bodies.indexOf(body);
                                if (index !== -1) bodies.splice(index, 1);
                            });
                            jiggle();
                            updateCounter();
                            if (getAllElements().length === 0) {
                                gameWon();
                            }
                        }, 500);
                    } else {
                        // Неправильная пара
                        wrongSound.play().catch(() => {});
                        selectedElement.classList.remove('selected');
                        this.classList.remove('selected');
                        selectedElement = null;
                        addNewPairs();
                    }
                } else {
                    // Первый выбор
                    this.classList.add('selected');
                    selectedElement = this;
                }
            }

            function updateElements() {
                world.bodies.forEach(body => {
                    const element = body.element;
                    if (!element || element.classList.contains('fading')) return;
                    const radius = parseInt(element.style.width) / 2;
                    element.style.transform = `translate(${body.position.x - radius}px, ${body.position.y - radius}px)`;
                });
            }

            // ---------- Меню ----------
            function wireOptionRow(rowId, attributeName, apply) {
                const row = document.querySelector(rowId);
                row.querySelectorAll('.option').forEach(btn => {
                    btn.addEventListener('click', () => {
                        row.querySelectorAll('.option').forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                        apply(btn.dataset[attributeName]);
                    });
                });
            }

            wireOptionRow('#typeRow', 'type', value => {
                settings.type = value;
            });

            wireOptionRow('#difficultyRow', 'difficulty', value => {
                settings.difficulty = value;
                difficultyHint.textContent = DIFFICULTY_HINTS[value];
            });

            difficultyHint.textContent = DIFFICULTY_HINTS[settings.difficulty];

            function showMenu() {
                resetGame();
                modeLabel.textContent = '';
                updateCounter();
                menuDiv.classList.add('open');
            }

            document.querySelector('#playButton').addEventListener('click', () => {
                menuDiv.classList.remove('open');
                startGame();
            });

            document.querySelectorAll('.modal-button.restart').forEach(btn => {
                btn.addEventListener('click', () => startGame());
            });

            document.querySelectorAll('.modal-button.tomenu').forEach(btn => {
                btn.addEventListener('click', showMenu);
            });

            document.querySelector('#menuButton').addEventListener('click', showMenu);

            (function render() {
                updateElements();
                requestAnimationFrame(render);
            })();
        });
    </script>
</body>
</html>
